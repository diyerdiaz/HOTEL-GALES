<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Gales - {{ _('Acceso de Personal') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lang-selector.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Language Switcher for Login -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 12px; align-items: center;">
        <!-- Dark Mode Toggle -->
        <button id="darkModeToggle" class="btn-theme-circle" title="Cambiar tema">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
        <div class="lang-dropdown">
            <button class="btn-premium-lang dropdown-toggle shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-globe2"></i>
                {% if session.get('language', 'es') == 'es' %}
                    <span><span class="fi fi-es rounded-circle"></span> <span class="lang-text">Español</span></span>
                {% else %}
                    <span><span class="fi fi-us rounded-circle"></span> <span class="lang-text">English</span></span>
                {% endif %}
                <i class="bi bi-chevron-down chevron ms-1"></i>
            </button>
            <ul class="dropdown-menu lang-dropdown-menu">
                <li>
                    <a class="lang-dropdown-item {{ 'active' if session.get('language', 'es') == 'es' else '' }}" href="{{ url_for('auth.set_language', lang='es') }}">
                        <span class="fi fi-es rounded-circle"></span> Español
                    </a>
                </li>
                <li>
                    <a class="lang-dropdown-item {{ 'active' if session.get('language') == 'en' else '' }}" href="{{ url_for('auth.set_language', lang='en') }}">
                        <span class="fi fi-us rounded-circle"></span> English
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Lado izquierdo - Hotel e Imagen Interior -->
            <div class="auth-image">
                <div class="auth-image-content">
                    <div class="hotel-title-wrapper">
                        <h2 class="font-brand">Hotel Gales</h2>
                        <span class="gold-vertical-bar"></span>
                    </div>
                    <div class="gold-diamond-motif">
                        <span>❖</span>
                    </div>
                    <p>{{ _('Su escape de lujo comienza aquí') }}</p>
                </div>
            </div>

            <!-- Lado derecho - Formulario -->
            <div class="auth-form">
                <h1>{{ _('Bienvenido') }}</h1>

                <div class="gold-divider">
                    <span class="diamond-icon">❖</span>
                </div>

                <p class="subtitle">{{ _('Por favor, ingrese sus credenciales para continuar') }}</p>

                <form method="post" action="{{ url_for('auth.login') }}">
                    <div class="form-group">
                        <label for="usuario">{{ _('USUARIO') }}</label>
                        <input type="text" id="usuario" name="usuario" placeholder="{{ _('Ingrese su usuario') }}" required>
                    </div>

                    <div class="form-group">
                        <label for="password">{{ _('CONTRASEÑA') }}</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="{{ _('Ingrese su contraseña') }}" required>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="{{ _('Mostrar contraseña') }}">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="recordarme" name="recordarme">
                        <label for="recordarme">{{ _('Recordarme') }}</label>
                    </div>

                    <button type="submit" class="btn-auth">
                        <i class="bi bi-box-arrow-in-right"></i> {{ _('INICIAR SESIÓN') }}
                    </button>
                </form>

                <div class="gold-divider bottom-divider">
                    <span class="diamond-icon">❖</span>
                </div>

                <div class="auth-footer">
                    <p><a href="{{ url_for('auth.recuperar_contrasena') }}" class="forgot-link">{{ _('¿Olvidaste tu contraseña?') }}</a></p>
                    <p class="register-link-text">{{ _('¿No tiene una cuenta?') }} 
                        <a href="{{ url_for('auth.register') }}" class="register-link">{{ _('Regístrese aquí') }}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
    <script>
        // --- NPROGRESS ---
        NProgress.configure({ showSpinner: false, speed: 500 });
        NProgress.start();
        window.onload = () => NProgress.done();

        // --- MOSTRAR/OCULTAR CONTRASEÑA ---
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.querySelector('i').classList.toggle('bi-eye');
            togglePassword.querySelector('i').classList.toggle('bi-eye-slash');
        });

        // --- DARK MODE LOGIC ---
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;
        const icon = darkModeToggle.querySelector('i');

        function updateThemeUI(isDark) {
            if (isDark) {
                body.classList.add('dark-mode');
                icon.className = 'bi bi-sun-fill';
            } else {
                body.classList.remove('dark-mode');
                icon.className = 'bi bi-moon-stars-fill';
            }
        }

        // Initial state load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        darkModeToggle.addEventListener('click', () => {
            const isDark = !body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        });

        // --- SWEETALERT2 FLASH MESSAGES ---
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    Swal.fire({
                        title: "{{ _('¡Hecho!') if category == 'success' else _('Atención') }}",
                        text: "{{ message }}",
                        icon: "{{ 'success' if category == 'success' else ('error' if category == 'danger' or category == 'error' else 'info') }}",
                        confirmButtonColor: '#d4af37',
                        background: document.body.classList.contains('dark-mode') ? '#1e293b' : '#fff',
                        color: document.body.classList.contains('dark-mode') ? '#fff' : '#111',
                        timer: 3500,
                        timerProgressBar: true
                    });
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
