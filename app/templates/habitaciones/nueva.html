{% extends 'base.html' %}

{% block titulo_contenido %}{{ _('Registrar Nueva Habitación') }}{% endblock %}

{% block content %}
<div class="content-card">
  <div class="content-card-header">
    <h5 class="mb-0"><i class="bi bi-plus-square me-2"></i>{{ _('Formulario de Registro') }}</h5>
  </div>
  <div class="content-card-body">
    <form method="POST" class="row g-3" enctype="multipart/form-data">
      
      <div class="col-md-6">
        <label class="form-label fw-bold">{{ _('Número de Habitación') }} <small class="text-muted">{{ _('(Máx. 4)') }}</small></label>
        <input type="text" id="numeroHabitacion" name="numeroHabitacion" class="form-control" placeholder="{{ _('Ej: 101') }}" required maxlength="4" oninput="validarLongitud(this, 4, '{{ _('El número de habitación no puede tener más de 4 dígitos') }}')">
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">{{ _('Tipo de Habitación') }}</label>
        <select name="idTipoHabitacion" class="form-select" required>
          <option value="" disabled selected>{{ _('Seleccione el tipo...') }}</option>
          {% for tipo in tipos %}
          <option value="{{ tipo.idTipoHabitacion }}">{{ tipo.nombreTipo }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">{{ _('Precio por Noche (COP)') }} <small class="text-muted">{{ _('(Máx. 7 dígitos)') }}</small></label>
        <div class="input-group">
          <span class="input-group-text">COP $</span>
          <input type="number" id="precioNoche" step="1" name="precioNoche" class="form-control" placeholder="{{ _('Máx. 9999999') }}" required oninput="validarLongitud(this, 7, '{{ _('El precio no puede tener más de 7 dígitos') }}')">
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">{{ _('Estado Inicial') }}</label>
        <select name="estadoHabitacion" class="form-select">
          <option value="disponible" selected>{{ _('Disponible') }}</option>
          <option value="mantenimiento">{{ _('Mantenimiento') }}</option>
          <option value="limpieza">{{ _('Limpieza') }}</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label fw-bold">{{ _('Imágenes de la Habitación') }} <small class="text-muted">{{ _('(Máx. 3 · JPG, PNG o WEBP)') }}</small></label>
        <div class="row g-3">
          {% for n in range(1, 4) %}
          <div class="col-md-4">
            <div class="border rounded-3 p-2 h-100 d-flex flex-column gap-2">
              <img id="preview_imagen{{ n }}" class="rounded-2 w-100 d-none" style="height: 140px; object-fit: cover;" alt="">
              <div id="placeholder_imagen{{ n }}" class="rounded-2 d-flex align-items-center justify-content-center text-muted" style="height: 140px; border: 1px dashed rgba(128,128,128,.4);">
                <i class="bi bi-image fs-2"></i>
              </div>
              <input type="file" name="imagen{{ n }}" class="form-control form-control-sm" accept=".jpg,.jpeg,.png,.webp" onchange="previsualizarImagen(this, {{ n }})">
            </div>
          </div>
          {% endfor %}
        </div>
      </div>

      <div class="col-12 mt-4">
        <hr>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-hotel px-4">
            <i class="bi bi-save"></i> {{ _('Guardar Habitación') }}
          </button>
          <a href="{{ url_for('habitaciones.index') }}" class="btn btn-outline-secondary px-4">
            {{ _('Cancelar') }}
          </a>
        </div>
      </div>

    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function validarLongitud(input, max, mensaje) {
  if (input.value.length > max) {
    input.value = input.value.slice(0, max);
    Swal.fire({
      icon: 'warning',
      title: '{{ _('Atención') }}',
      text: mensaje,
      confirmButtonColor: '#d4af37'
    });
  }
}
function previsualizarImagen(input, n) {
  const preview = document.getElementById('preview_imagen' + n);
  const placeholder = document.getElementById('placeholder_imagen' + n);
  if (input.files && input.files[0]) {
    preview.src = URL.createObjectURL(input.files[0]);
    preview.classList.remove('d-none');
    placeholder.classList.add('d-none');
    placeholder.classList.remove('d-flex');
  }
}
</script>
{% endblock %}
