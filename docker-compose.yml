version: '3.8'

services:
  web:
    build: .
    expose:
      - "81"
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      # PostgreSQL: o DATABASE_URL completa, o las cinco variables DB_*
      - DATABASE_URL=${DATABASE_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - URL_PUBLICA=${URL_PUBLICA}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SENDER=${MAIL_SENDER}
      - MAIL_SENDER_NAME=${MAIL_SENDER_NAME}
    restart: always
    # Carpetas que deben sobrevivir a cada despliegue: fotos de habitaciones
    # y la base SQLite de respaldo (solo se usa si no hay PostgreSQL configurado)
    volumes:
      - uploads:/app/app/static/uploads
      - instance:/app/instance
    networks:
      - coolify

volumes:
  uploads:
  instance:

networks:
  coolify:
    external: true
